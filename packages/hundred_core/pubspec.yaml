name: hundred_core
description: >-
  Core of the 100 Days challenge app: the event feed fold, streaks, XP and
  leagues, habit and plan domain logic, the coach, meal planning and the
  checks on what a language model answers. Pure Dart, no Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  collection: ^1.18.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
