name: hundred_core
description: >-
  Local-first, peer-to-peer core for the 100 Days challenge app: self-sovereign
  identity, a signed hash-chained activity feed, habit/plan domain logic, an
  on-device coaching engine and the gossip sync protocol. Pure Dart, no Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  collection: ^1.18.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
