name: Backend secrets from GitHub

# Copies the store credentials that already live in GitHub into the
# Supabase function secrets, so they never pass through a laptop:
#   PLAY_SERVICE_ACCOUNT_JSON (play-internal) -> GOOGLE_SERVICE_ACCOUNT_JSON
# verify-purchase reads it to ask Google Play whether a subscription is real.
# Runs when this file changes on dev or main.
on:
  push:
    branches: [dev, main]
    paths: [".github/workflows/backend-secrets.yml"]

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: play-internal
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check for secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set"
            exit 1
          fi
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest
      - name: Set GOOGLE_SERVICE_ACCOUNT_JSON
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          compact=$(python3 -c 'import json,os; print(json.dumps(json.loads(os.environ["PLAY_JSON"]), separators=(",", ":")))')
          supabase secrets set --remote="$PROJECT_REF" --yes "GOOGLE_SERVICE_ACCOUNT_JSON=$compact"
