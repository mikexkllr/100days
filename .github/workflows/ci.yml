name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: hundred_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hundred_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    name: app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release, split per ABI: ~25 MB per file instead of ~170 MB for a
      # universal debug build, which matters when the point is to sideload it
      # onto a phone. Signed with the debug key — fine for testing, not for
      # the Play Store.
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: hundred-days-apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
