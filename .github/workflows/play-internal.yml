name: Play Store release

# Two pipes, chosen by the branch:
#   dev  -> internal testing (no review, testers have it within minutes)
#   main -> closed testing (track "alpha", reviewed by Google; the step
#           before production, which new accounts may only request after
#           14 days of closed testing with 12 testers)
# Every run first passes the full CI, then builds a release AAB signed with
# the upload key. A manual run works from any branch and picks the track
# itself; untick the upload input to build and sign without touching the
# store.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      upload:
        description: >-
          Upload to the store. Untick to build and sign only, for example to
          try the pipeline on a branch (docs/play-release.md).
        type: boolean
        default: true
      track:
        description: Play track for a manual run
        type: choice
        options: [internal, alpha]
        default: internal

permissions:
  contents: read

# A merge and a manual press of the button queue up rather than racing into
# the same edit.
concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Android AAB → Play
    needs: checks
    runs-on: ubuntu-latest
    # The secrets live in this environment, not at repository level, so no
    # other workflow can read the upload key or the Play credentials
    # (docs/play-release.md).
    environment: play-internal
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter-android

      - name: Check the secrets are set
        # Only whether each secret is set reaches this step, never its value.
        # A push to main always uploads, so the Play credentials are always
        # required there; a manual run without the upload input does not
        # need them.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS != '' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' || (github.event_name == 'workflow_dispatch' && !inputs.upload) }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEYSTORE_ALIAS PLAY_SERVICE_ACCOUNT_JSON; do
            [ "${!name}" = "true" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in the play-internal environment:$missing (see docs/play-release.md)"
            exit 1
          fi

      - name: Decode and open the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (see docs/play-release.md)"
            exit 1
          fi
          # A wrong password or alias fails here, in seconds, instead of after
          # the build. The fingerprint printed on success is the one the Play
          # Console shows as the upload key certificate.
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS"; then
            echo "::error::The keystore does not open with ANDROID_KEYSTORE_PASSWORD, or holds no key named by ANDROID_KEYSTORE_ALIAS"
            exit 1
          fi
          echo "HUNDRED_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Pick the version code
        # Play refuses a version code it has seen before. The run number only
        # goes up, so every run gets a fresh one without a pubspec bump; the
        # offset keeps clear of the +N in pubspec.yaml that local builds use.
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Shipping $(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1) as version code $((1000 + GITHUB_RUN_NUMBER))"

      # Build-time ids that belong to this deployment rather than to the
      # code — Google OAuth client ids, the Firebase app — as a JSON secret
      # (docs/self-hosting.md). Without it the build uses the defaults in
      # backend_config.dart, and the features that need them stay off.
      - name: Write the build defines
        env:
          APP_DEFINES_JSON: ${{ secrets.APP_DEFINES_JSON }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'internal' }}
        run: |
          mkdir -p config
          if [ -n "$APP_DEFINES_JSON" ]; then
            printf '%s' "$APP_DEFINES_JSON" > config/release.json
          else
            echo '{}' > config/release.json
          fi
          # Crash reports go to Sentry only with the SENTRY_DSN secret; an
          # empty DSN leaves them off (lib/main.dart).
          jq --arg dsn "$SENTRY_DSN" --arg env "$SENTRY_ENVIRONMENT" \
            '. + {SENTRY_DSN: $dsn, SENTRY_ENVIRONMENT: $env}' \
            config/release.json > config/release.tmp
          mv config/release.tmp config/release.json

      - name: Build the release bundle
        env:
          HUNDRED_REQUIRE_UPLOAD_KEY: "true"
          HUNDRED_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUNDRED_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          HUNDRED_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release --build-number="$VERSION_CODE"
          --dart-define-from-file=config/release.json

      # An AAB is for the store, not for sideloading — kept as an artifact so
      # the first release can be uploaded by hand and every later one can be
      # inspected and bit-compared afterwards.
      - name: Keep the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: hundred-days-aab-${{ env.VERSION_CODE }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to the track
        # Every push is a release; a manual run decides with the input. The
        # input does not exist on a push, and a missing input would read as
        # false — so the push case is named first.
        if: github.event_name == 'push' || inputs.upload
        # Pinned to a commit: this step holds the Play credentials.
        # changesNotSentForReview stays at its default on purpose — if Play
        # ever wants to review a change, the run fails and says so instead of
        # parking the release in the Console where nobody looks.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hundreddays.hundred_days
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event_name == 'workflow_dispatch' && inputs.track || (github.ref == 'refs/heads/main' && 'alpha' || 'internal') }}
          # A draft app (never reviewed) only takes draft releases outside
          # internal testing; the closed-test draft is then sent for review in
          # the Play Console. Set PLAY_ALPHA_STATUS=completed once the app is live.
          status: ${{ (github.event_name == 'workflow_dispatch' && inputs.track || (github.ref == 'refs/heads/main' && 'alpha' || 'internal')) == 'internal' && 'completed' || (vars.PLAY_ALPHA_STATUS || 'draft') }}
          whatsNewDirectory: app/android/fastlane/whatsnew

      - name: Say what to do with a bundle that was not uploaded
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        run: |
          {
            echo "### Built, not uploaded"
            echo
            echo "Download **hundred-days-aab-$VERSION_CODE** from this run's artifacts, unzip it and upload"
            echo "\`app-release.aab\` in the Play Console under **Test and release → Testing → Internal testing"
            echo "→ Create new release**. See docs/play-release.md, *The first release*."
          } >> "$GITHUB_STEP_SUMMARY"
