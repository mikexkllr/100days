name: hundred_days
description: >-
  100 Tage und weit darüber hinaus — eine offene, lokal-first Challenge-App
  mit Peer-to-Peer-Sync, selbstverwalteter Identität und Coach auf dem Gerät.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hundred_core:
    path: ../packages/hundred_core
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
