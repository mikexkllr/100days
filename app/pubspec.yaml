name: hundred_days
description: >-
  100 days and far beyond: an open-source challenge app with friends,
  leagues, training and nutrition plans, and an AI coach.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  hundred_core:
    path: ../packages/hundred_core
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  # The backend: auth, the event feed, friends, households, realtime.
  supabase_flutter: ^2.12.0
  # Native sign-in sheets; the ID token goes to Supabase Auth.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  # Every language model call: through the project's gateway, or straight
  # to a provider with the user's own key.
  dartantic_ai: 3.4.2
  http: ^1.2.2
  # Meal photos: camera or gallery, then downscaled and stripped of metadata.
  image_picker: ^1.2.0
  image: ^4.5.4
  # Premium, through the stores' own billing.
  in_app_purchase: ^3.3.0
  # Finding friends in the address book. Contacts are compared on the
  # server as keyed hashes and never stored.
  flutter_contacts: 2.6.0
  # Push notifications from friends (nudges, cheers, requests). Only active
  # when the build carries a Firebase configuration (docs/self-hosting.md).
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  # Invite links (hundreddays://invite/CODE) that open the app.
  app_links: ^7.2.2
  # The nonce that binds a sign-in to this request.
  crypto: ^3.0.3
  # The streak on the home screen: hands the native widget its data and the
  # flame, drawn by the same painter as in the app.
  home_widget: ^0.10.0
  # Crackle, ignition and the slot machine (assets/sounds, made by
  # tool/make_sounds.py). Switchable, and quiet in silent mode.
  audioplayers: ^6.1.0
  sentry_flutter: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # tool/store_screenshots.sh walks the demo through the store screens.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # iOS plugins come from CocoaPods (ios/Podfile.lock). With Swift Package
  # Manager, firebase_messaging and google_sign_in_ios pin conflicting
  # Google SDK versions and the archive fails to resolve.
  config:
    enable-swift-package-manager: false
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/sounds/
  # Unbounded for numbers, headlines and buttons; Manrope for everything
  # else (both SIL OFL 1.1, see assets/fonts/OFL.txt).
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
