name: hundred_days
description: >-
  100 Tage und weit darüber hinaus — eine offene, lokal-first Challenge-App
  mit Peer-to-Peer-Sync, selbstverwalteter Identität und Coach auf dem Gerät.
publish_to: none
version: 0.1.0+1

environment:
  # llamadart, the on-device inference engine, needs Dart 3.10.7.
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  hundred_core:
    path: ../packages/hundred_core
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  # Which phone this is and how much memory it has, to pick a model that fits.
  device_info_plus: 12.4.0
  # llama.cpp for Dart: runs the GGUF model on the device. Pinned exactly —
  # it moves fast, and its build hook fetches native runtimes per version.
  llamadart: 0.13.2
  # Verifies a downloaded model against its published SHA-256.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

# Only the llama.cpp runtime: the app loads GGUF models and nothing else, and
# leaving out LiteRT-LM keeps the APK tens of megabytes smaller. On Android
# only the CPU backend: llama.cpp's Vulkan path is experimental there and
# would add 26 MB that the app never uses.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android: [cpu]
